<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Terminal banner: Hello World!, I'm Khaled - Software Developer and Tech Explorer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d2ff"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#00d2ff" flood-opacity="0.28"/>
    </filter>
    <clipPath id="typeClip"><rect class="typing" x="178" y="74" width="81" height="24"/></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace; white-space: pre; }
    .k { fill:#89dceb; font-weight:700; }
    .v { fill:#cdd6f4; }
    .fade   { animation: show .3s ease-out backwards; }
    .typing { animation: type .9s steps(9) .4s backwards; }
    .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes show  { from { opacity:0; } }
    @keyframes type  { from { width:0; } }
    @keyframes blink { 50% { opacity:0; } }
  </style>

  <!-- window -->
  <rect x="14" y="10" width="972" height="420" rx="14" fill="#1e1e2e" stroke="#00d2ff" stroke-opacity="0.35" filter="url(#glow)"/>

  <!-- zsh tab bar -->
  <path d="M14 24 a14 14 0 0 1 14 -14 H972 a14 14 0 0 1 14 14 V52 H14 Z" fill="#11111b"/>
  <rect x="28" y="18" width="176" height="34" rx="8" fill="#1e1e2e"/>
  <text x="44" y="40" font-size="13" fill="#89dceb">1: khaled@arch</text>
  <text x="226" y="40" font-size="13" fill="#6c7086">2: nvim</text>
  <text x="312" y="40" font-size="13" fill="#6c7086">3: htop</text>
  <text x="970" y="40" font-size="12" fill="#45475a" text-anchor="end">zsh</text>

  <!-- prompt 1 : typed command -->
  <text x="34" y="92" font-size="15" textLength="144" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#a6e3a1">khaled</tspan><tspan fill="#cdd6f4">@</tspan><tspan fill="#89b4fa">arch</tspan><tspan fill="#cba6f7"> ~ </tspan><tspan fill="#f9e2af">$ </tspan></text>
  <g clip-path="url(#typeClip)">
    <text x="178" y="92" font-size="15" fill="#cdd6f4" textLength="81" lengthAdjust="spacing">fastfetch</text>
  </g>

  <!-- arch logo -->
  <g class="fade" style="animation-delay:1.5s" fill="#1793D1" font-size="18" font-weight="700" xml:space="preserve">
    <text x="50" y="148">      /\</text>
    <text x="50" y="168">     /  \</text>
    <text x="50" y="188">    /\   \</text>
    <text x="50" y="208">   /      \</text>
    <text x="50" y="228">  /   ,,   \</text>
    <text x="50" y="248"> /   |  |  -\</text>
    <text x="50" y="268">/_-''    ''-_\</text>
  </g>

  <!-- title -->
  <text class="fade" style="animation-delay:1.7s" x="270" y="140" font-size="30" font-weight="700" fill="url(#title)">👋 Hello World!, I'm Khaled</text>
  <line class="fade" style="animation-delay:1.8s" x1="270" y1="156" x2="950" y2="156" stroke="#313244" stroke-width="2"/>

  <!-- info rows -->
  <g font-size="14" xml:space="preserve">
    <g class="fade" style="animation-delay:2.0s"><text class="k" x="270" y="188">Role</text><text class="v" x="372" y="188">💻 Software Developer | Tech Explorer | 💡 Life-long Learner</text></g>
    <g class="fade" style="animation-delay:2.2s"><text class="k" x="270" y="213">Journey</text><text class="v" x="372" y="213">From Low-Level Firmware to High-Level Applications 📱 &amp; Security 🛡️</text></g>
    <g class="fade" style="animation-delay:2.4s"><text class="k" x="270" y="238">Mobile</text><text class="v" x="372" y="238">Flutter · Dart · BLoC · Clean Architecture</text></g>
    <g class="fade" style="animation-delay:2.6s"><text class="k" x="270" y="263">Backend</text><text class="v" x="372" y="263">Firebase · Node.js/Express · REST APIs · SQL</text></g>
    <g class="fade" style="animation-delay:2.8s"><text class="k" x="270" y="288">Security</text><text class="v" x="372" y="288">Web AppSec · PortSwigger Academy</text></g>
    <g class="fade" style="animation-delay:3.0s"><text class="k" x="270" y="313">Embedded</text><text class="v" x="372" y="313">AVR · PIC · Embedded C fundamentals</text></g>
    <g class="fade" style="animation-delay:3.2s"><text class="k" x="270" y="338">Status</text><text class="v" x="372" y="338"><tspan fill="#a6e3a1">●</tspan> Open to Opportunities</text></g>
  </g>

  <!-- color palette -->
  <g class="fade" style="animation-delay:3.6s">
    <rect x="270" y="380" width="30" height="10" fill="#45475a"/>
    <rect x="300" y="380" width="30" height="10" fill="#45475a"/>
    <rect x="330" y="380" width="30" height="10" fill="#89b4fa"/>
    <rect x="360" y="380" width="30" height="10" fill="#89b4fa"/>
    <rect x="390" y="380" width="30" height="10" fill="#89dceb"/>
    <rect x="420" y="380" width="30" height="10" fill="#89dceb"/>
    <rect x="450" y="380" width="30" height="10" fill="#bac2de"/>
    <rect x="480" y="380" width="30" height="10" fill="#bac2de"/>
  </g>

  <!-- prompt 2 + blinking cursor -->
  <g class="fade" style="animation-delay:3.8s">
    <text x="34" y="414" font-size="15" textLength="144" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#a6e3a1">khaled</tspan><tspan fill="#cdd6f4">@</tspan><tspan fill="#89b4fa">arch</tspan><tspan fill="#cba6f7"> ~ </tspan><tspan fill="#f9e2af">$ </tspan></text>
    <rect class="cursor" x="180" y="401" width="9" height="17" fill="#cdd6f4"/>
  </g>
</svg>
